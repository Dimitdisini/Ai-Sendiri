<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kantor AI · Team Dimitri</title>
  <link rel="stylesheet" href="/style.css" />
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>

  <!-- SIDEBAR KIRI -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">KAI</div>
      <div class="brand-text">
        <span class="brand-title">Kantor AI</span>
        <span class="brand-sub">Team Dimitri</span>
      </div>
    </div>

    <div class="sidebar-clock">
      <span class="live-dot"></span>
      <span id="liveTime">--:--:--</span>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-tab="overview">
        <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>
        Overview
      </button>
      <button class="nav-item" data-tab="roadmap">
        <svg viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h10M3 15h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Roadmap
      </button>
      <button class="nav-item" data-tab="keputusan">
        <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.6"/><path d="M10 6.5v4l2.5 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Keputusan
      </button>
      <button class="nav-item" data-tab="output">
        <svg viewBox="0 0 20 20" fill="none"><path d="M5 2.5h7l3.5 3.5V17a.5.5 0 01-.5.5h-10A.5.5 0 014.5 17V3a.5.5 0 01.5-.5z" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.5V6H15.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        Output
      </button>
      <button class="nav-item" data-tab="bukti">
        <svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="4" width="15" height="12" rx="1.5" stroke="currentColor" stroke-width="1.6"/><circle cx="7" cy="9" r="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 14l4-4 3 3 2.5-2.5 5.5 5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Bukti QA
      </button>
    </nav>

    <div class="sidebar-divider"></div>

    <!-- Perusahaan switch -->
    <div class="sidebar-section-label">Perusahaan</div>
    <div id="companyList" class="company-list"></div>

    <div class="sidebar-bottom">
      <div class="stat-row">
        <span class="stat-label">Progres Roadmap</span>
        <span class="stat-val" id="sideRoadmap">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Plan / QA</span>
        <span class="stat-val" id="sidePlan">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">BLOKIR</span>
        <span class="stat-val warn" id="sideBlokir">—</span>
      </div>
    </div>
  </aside>

  <!-- AREA KONTEN KANAN -->
  <div class="content">

    <!-- Banner quota -->
    <div class="quota-banner" id="quotaBanner" style="display:none"></div>

    <!-- OVERVIEW -->
    <section class="page active" id="pageOverview">
      <!-- Kanvas isometrik -->
      <div class="canvas-wrap">
        <div id="office3d" style="display:none;position:relative;width:100%"></div>
        <canvas id="officeCanvas" width="1200" height="640"></canvas>
      </div>
      <!-- Grid kartu agen -->
      <div class="agent-section-header">
        <span class="section-title">Tim Aktif</span>
        <span class="section-sub" id="agentSubtitle">—</span>
      </div>
      <div class="agent-grid" id="agentGrid"></div>
    </section>

    <!-- ROADMAP -->
    <section class="page" id="pageRoadmap">
      <div class="page-header">
        <h2>Roadmap</h2>
        <span class="page-sub" id="roadmapCompanyLabel"></span>
      </div>
      <div id="tabRoadmap" class="table-wrap"></div>
    </section>

    <!-- KEPUTUSAN -->
    <section class="page" id="pageKeputusan">
      <div class="page-header">
        <h2>Keputusan</h2>
        <span class="page-sub" id="keputusanCompanyLabel"></span>
      </div>
      <div id="tabKeputusan" class="table-wrap"></div>
    </section>

    <!-- OUTPUT -->
    <section class="page" id="pageOutput">
      <div class="page-header">
        <h2>Output Dokumen</h2>
        <span class="page-sub">File yang paling baru diubah</span>
      </div>
      <div id="tabOutput"></div>
    </section>

    <!-- BUKTI QA -->
    <section class="page" id="pageBukti">
      <div class="page-header">
        <h2>Bukti QA</h2>
        <span class="page-sub">Screenshot hasil pengujian</span>
      </div>
      <div id="tabBukti"></div>
    </section>

  </div>

  <script src="/office.js"></script>
  <script src="/app.js"></script>
  <script type="module" src="/office3d.js"></script>
</body>
</html>
